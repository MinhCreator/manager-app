# Material You Dark Theme — Material Design 3 Color Tokens
@background=rgb(28,27,31)
@foreground=rgb(230,225,229)
@selectionForeground=rgb(28,27,31)
@selectionBackground=mix($Component.accent.default,@foreground,40%)
@focusColor=alpha($Component.accent.default,40%)
@focusStrokeColor=$Component.accent.default
@borderColor=rgb(73,69,79)
@disabledForeground=rgba(230,225,229,128)
@disabledBackground=rgba(73,69,79,128)
@disabledBorderColor=rgba(73,69,79,128)
@activeBackground=rgb(51,43,75)
@activeForeground=rgb(230,225,229)
@accentColor=#D0BCFF

# M3 Surface / Container
Panel.background=rgb(28,27,31)
Panel.foreground=$foreground
Panel.borderColor=rgb(73,69,79)
OptionPane.messageForeground=$foreground

# M3 Primary Container Surfaces
Component.accentColor=$accentColor
Component.borderColor=$borderColor
Component.focusColor=$focusColor
Component.focusWidth=2
Component.arc=12
Component.focusStrokeColor=$focusStrokeColor

Button.arc=16
Button.margin=6,14,6,14
Button.background=rgb(51,43,75)
Button.foreground=rgb(230,225,229)
Button.selectedBackground=rgb(74,62,104)
Button.hoverBackground=rgb(62,52,90)
Button.pressedBackground=rgb(74,62,104)
Button.borderColor=rgb(73,69,79)
Button.disabledBackground=rgba(51,43,75,96)
Button.default.background=#D0BCFF
Button.default.foreground=rgb(28,27,31)
Button.default.hoverBackground=#C4ABF0
Button.default.pressedBackground=#B899E8
Button.default.borderWidth=0

# M3 Text Fields
TextComponent.arc=12
TextField.background=rgb(28,27,31)
TextField.foreground=$foreground
TextField.borderColor=rgb(73,69,79)
TextField.focusedBorderColor=$accentColor
TextField.margin=6,8,6,8
PasswordField.margin=6,8,6,8
FormattedTextField.margin=6,8,6,8

# M3 Combo / Spinner
ComboBox.padding=6,8,6,8
ComboBox.arc=12
Spinner.arc=12

# M3 Tabs
TabbedPane.arc=12
TabbedPane.selectedBackground=rgb(51,43,75)
TabbedPane.contentArc=12
TabbedPane.tabInsets=6,14,6,14

# M3 Scrollbars
ScrollBar.thumbArc=999
ScrollBar.trackArc=999
ScrollBar.thumbInsets=2,2,2,2
ScrollBar.trackInsets=2,2,2,2
ScrollBar.width=10

# M3 Table
Table.arc=12
Table.rowHeight=40
Table.selectionBackground=rgb(51,43,75)
Table.selectionForeground=$foreground
Table.gridColor=rgb(73,69,79)

# M3 Menu Sidebar
Menu.background=rgb(39,37,42)
Menu.foreground=$foreground
Menu.lineColor=rgb(73,69,79)
Menu.arrowColor=rgb(160,156,163)
Menu.lightdark.background=rgb(49,46,53)
Menu.lightdark.button.background=rgb(74,62,104)
Menu.title.foreground=rgb(160,156,163)
Menu.button.background=rgb(49,46,53)
Menu.button.selectedBackground=rgb(51,43,75)
Menu.button.selectedForeground=$foreground
Menu.ScrollBar.background=$Menu.background
Menu.ScrollBar.thumb=rgb(73,69,79)
Menu.header.font=bold +4
Menu.label.font=-2
Menu.scroll.width=5
Menu.scroll.trackInsets=2,0,2,1
Menu.scroll.thumbInsets=$Menu.scroll.trackInsets
Menu.icon.lightColor=rgb(51,43,75)
Menu.icon.darkColor=rgb(160,156,163)

# M3 Cards
Card.background=rgb(39,37,42)
Card.borderColor=rgb(73,69,79)
Card.arc=16

# M3 Drawer / Dialog
Drawer.background=rgb(39,37,42)
OptionPane.background=rgb(39,37,42)
Dialog.background=rgb(39,37,42)
Popup.background=rgb(39,37,42)
Popup.borderColor=rgb(73,69,79)
Popup.dropShadowInsets=2,8,10,10

# Toast Notifications
Toast.useEffect=false
Toast.success.outlineColor=#4CAF50
Toast.info.outlineColor=#D0BCFF
Toast.warning.outlineColor=#FF9800
Toast.error.outlineColor=#EF5350
Toast.background=rgb(39,37,42)

# Accent Colors (M3 Dark Palette)
App.accent.default=#D0BCFF
App.accent.blue=#8AB4F8
App.accent.purple=#D0BCFF
App.accent.red=#F2B8B5
App.accent.orange=#FBC02D
App.accent.yellow=#FDE293
App.accent.green=#81C995

# Notification / Toast styling
Notifications.center.foreground=$foreground
Notifications.center.background=$Panel.background

# Color roles for styled buttons
color.neutral=tint($Panel.background,5%)
color.primary=#D0BCFF
color.secondary=#CCC2DC
color.info=#8AB4F8
color.success=#81C995
color.warning=#FDE293
color.danger=#F2B8B5
color.ghost=$color.neutral
foreground.primary=rgb(28,27,31)
foreground.secondary=rgb(28,27,31)
foreground.info=rgb(28,27,31)
foreground.success=rgb(28,27,31)
foreground.warning=rgb(28,27,31)
foreground.danger=rgb(28,27,31)

# Login page
Login.background=lighten(@background,2%)

# Material You Light Theme — Material Design 3 Color Tokens
@background=rgb(255,251,254)
@foreground=rgb(28,27,31)
@selectionForeground=rgb(255,251,254)
@selectionBackground=mix($Component.accent.default,@foreground,40%)
@focusColor=alpha($Component.accent.default,40%)
@focusStrokeColor=$Component.accent.default
@borderColor=rgb(200,196,204)
@disabledForeground=rgba(28,27,31,128)
@disabledBackground=rgba(200,196,204,128)
@disabledBorderColor=rgba(200,196,204,128)
@activeBackground=rgb(232,222,248)
@activeForeground=rgb(28,27,31)
@accentColor=#6750A4

# M3 Surface / Container
Panel.background=rgb(255,251,254)
Panel.foreground=$foreground
Panel.borderColor=rgb(230,225,229)
OptionPane.messageForeground=$foreground

# M3 Primary Container Surfaces
Component.accentColor=$accentColor
Component.borderColor=$borderColor
Component.focusColor=$focusColor
Component.focusWidth=2
Component.arc=12
Component.focusStrokeColor=$focusStrokeColor

Button.arc=16
Button.margin=6,14,6,14
Button.background=rgb(232,222,248)
Button.foreground=rgb(30,25,43)
Button.selectedBackground=rgb(206,189,236)
Button.hoverBackground=rgb(220,210,240)
Button.pressedBackground=rgb(206,189,236)
Button.borderColor=rgb(200,196,204)
Button.disabledBackground=rgba(232,222,248,96)
Button.default.background=#6750A4
Button.default.foreground=rgb(255,251,254)
Button.default.hoverBackground=#7C6AB5
Button.default.pressedBackground=#5945A0
Button.default.borderWidth=0

# M3 Text Fields
TextComponent.arc=12
TextField.background=rgb(255,251,254)
TextField.foreground=$foreground
TextField.borderColor=rgb(200,196,204)
TextField.focusedBorderColor=$accentColor
TextField.margin=6,8,6,8
PasswordField.margin=6,8,6,8
FormattedTextField.margin=6,8,6,8

# M3 Combo / Spinner
ComboBox.padding=6,8,6,8
ComboBox.arc=12
Spinner.arc=12

# M3 Tabs
TabbedPane.arc=12
TabbedPane.selectedBackground=rgb(232,222,248)
TabbedPane.contentArc=12
TabbedPane.tabInsets=6,14,6,14

# M3 Scrollbars
ScrollBar.thumbArc=999
ScrollBar.trackArc=999
ScrollBar.thumbInsets=2,2,2,2
ScrollBar.trackInsets=2,2,2,2
ScrollBar.width=10

# M3 Table
Table.arc=12
Table.rowHeight=40
Table.selectionBackground=rgb(232,222,248)
Table.selectionForeground=$foreground
Table.gridColor=rgb(230,225,229)

# M3 Menu Sidebar
Menu.background=rgb(255,251,254)
Menu.foreground=$foreground
Menu.lineColor=rgb(200,196,204)
Menu.arrowColor=rgb(120,117,124)
Menu.lightdark.background=rgb(248,245,250)
Menu.lightdark.button.background=rgb(232,222,248)
Menu.title.foreground=rgb(120,117,124)
Menu.button.background=rgb(248,245,250)
Menu.button.selectedBackground=rgb(232,222,248)
Menu.button.selectedForeground=rgb(30,25,43)
Menu.ScrollBar.background=$Menu.background
Menu.ScrollBar.thumb=rgb(200,196,204)
Menu.header.font=bold +4
Menu.label.font=-2
Menu.scroll.width=5
Menu.scroll.trackInsets=2,0,2,1
Menu.scroll.thumbInsets=$Menu.scroll.trackInsets
Menu.icon.lightColor=rgb(232,222,248)
Menu.icon.darkColor=rgb(120,117,124)

# M3 Cards
Card.background=rgb(255,251,254)
Card.borderColor=rgb(230,225,229)
Card.arc=16

# M3 Drawer / Dialog
Drawer.background=rgb(255,251,254)
OptionPane.background=rgb(255,251,254)
Dialog.background=rgb(255,251,254)
Popup.background=rgb(255,251,254)
Popup.borderColor=rgb(230,225,229)
Popup.dropShadowInsets=2,8,10,10

# Toast Notifications
Toast.useEffect=false
Toast.success.outlineColor=#4CAF50
Toast.info.outlineColor=#6750A4
Toast.warning.outlineColor=#FF9800
Toast.error.outlineColor=#E53935
Toast.background=rgb(255,251,254)

# Accent Colors (M3 Palette)
App.accent.default=#6750A4
App.accent.blue=#1A73E8
App.accent.purple=#6750A4
App.accent.red=#B3261E
App.accent.orange=#FF8F00
App.accent.yellow=#F9AB00
App.accent.green=#1E8E3E

# Notification / Toast styling
Notifications.center.foreground=$foreground
Notifications.center.background=$Panel.background

# Color roles for styled buttons
color.neutral=tint($Panel.background,5%)
color.primary=#6750A4
color.secondary=#625B71
color.info=#1A73E8
color.success=#1E8E3E
color.warning=#F9AB00
color.danger=#B3261E
color.ghost=$color.neutral
foreground.primary=rgb(255,251,254)
foreground.secondary=rgb(255,251,254)
foreground.info=rgb(255,251,254)
foreground.success=rgb(255,251,254)
foreground.warning=rgb(28,27,31)
foreground.danger=rgb(255,251,254)

# Login page
Login.background=shade(@background,2%)
